<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Darionyx — Apps</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --bg: #f8fafc;
      --white: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    nav {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-brand {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
    }

    main {
      flex: 1;
      max-width: 780px;
      margin: 60px auto;
      padding: 0 24px;
      width: 100%;
    }

    h1 {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 40px;
      font-size: 16px;
    }

    .app-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px;
      display: flex;
      align-items: flex-start;
      gap: 20px;
    }

    .app-logo {
      width: 56px;
      height: 56px;
      background: var(--primary);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 22px;
      flex-shrink: 0;
    }

    .app-info h2 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 4px;
      border: none;
      padding: 0;
    }

    .app-info p {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 16px;
    }

    .app-links {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 8px 18px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      display: inline-block;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover { background: var(--primary-dark); }

    .btn-outline {
      border: 1.5px solid var(--border);
      color: var(--muted);
    }

    .btn-outline:hover { border-color: var(--primary); color: var(--primary); }

    footer {
      text-align: center;
      padding: 24px;
      color: var(--muted);
      font-size: 13px;
      border-top: 1px solid var(--border);
      background: var(--white);
    }
  </style>
</head>
<body>

<nav>
  <a href="/" class="nav-brand">Darionyx</a>
</nav>

<main>
  <h1>Our Apps</h1>
  <p class="subtitle">Mobile and web applications by Darionyx.</p>

  <div class="app-card">
    <div class="app-logo">П</div>
    <div class="app-info">
      <h2>Prostir — Простір</h2>
      <p>Shared household budget management for couples. Connects to Monobank &amp; PrivatBank automatically.</p>
      <div class="app-links">
        <a href="https://play.google.com/store/apps/details?id=com.darionyx.prostir" class="btn btn-primary">Google Play</a>
        <a href="prostir/privacy.html" class="btn btn-outline">Privacy Policy</a>
      </div>
    </div>
  </div>
</main>

<footer>
  <p>© 2026 Darionyx. <a href="prostir/privacy.html" style="color: var(--primary); text-decoration: none;">Privacy Policy — Prostir</a></p>
</footer>

</body>
</html>
